services:
  mt5:
    image: gmag11/metatrader5_vnc
    container_name: mt5-demo
    shm_size: 2gb
    init: true
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8001:8001"
    environment:
      - PASSWORD=demo-password
      - MT5_API_BIND=0.0.0.0
    volumes:
      - mt5_data:/config

volumes:
  mt5_data:
