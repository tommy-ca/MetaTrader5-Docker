services:
  mt5:
    build: .
    image: gmag11/metatrader5_vnc
    container_name: mt5
    volumes:
      - ./config:/config
    ports:
      - 3000:3000
      - 8001:8001
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "timeout", "1", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8001"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  tester:
    image: gmag11/metatrader5_vnc
    container_name: mt5-tester
    depends_on:
      mt5:
        condition: service_healthy
    environment:
      - MT5_HOST=mt5
      - MT5_PORT=8001
    command: ["python3", "/scripts/validate_connectivity.py"]
    volumes:
      - ./scripts:/scripts:ro
