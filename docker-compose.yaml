services:
  mt5:
    build: .
    image: gmag11/metatrader5_vnc
    container_name: mt5
    init: true
    shm_size: 2gb
    volumes:
      - ./config:/config
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:8001:8001
    env_file:
      - .env
    environment:
      # RPyC binding address inside the container. 
      # Set to 0.0.0.0 to allow access from the host via mapped ports.
      # The 'ports' section above restricts access to the host loopback (127.0.0.1).
      - MT5_HOST=0.0.0.0
      - MT5_PORT=8001
