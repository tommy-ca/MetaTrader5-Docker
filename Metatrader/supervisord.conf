[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mt5]
command=wine "/config/.wine/drive_c/Program Files/MetaTrader 5/terminal64.exe" /portable /config:%(ENV_MT5_CONFIG_PATH)s
autorestart=true
priority=10
stdout_logfile=/var/log/mt5.stdout.log
stderr_logfile=/var/log/mt5.stderr.log

[program:bridge]
command=wine python /Metatrader/mt5_bridge.py
autorestart=true
priority=20
stdout_logfile=/var/log/bridge.stdout.log
stderr_logfile=/var/log/bridge.stderr.log
environment=WINEPREFIX="/config/.wine"
